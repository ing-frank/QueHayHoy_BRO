<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="theme-color" content="#0A0A0F" id="meta-theme"/>
<meta name="description" content="Descubre qué hay hoy en tu provincia de República Dominicana — eventos, lugares y experiencias en tiempo real."/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="QHH BRO"/>
<meta name="mobile-web-app-capable" content="yes"/>
<!-- Open Graph -->
<meta property="og:title" content="QueHayHoy BRO"/>
<meta property="og:description" content="¿Qué hago esta noche? La app que responde esa pregunta en RD."/>
<meta property="og:type" content="website"/>
<meta property="og:image" content="/icons/icon-512.png"/>
<title>QueHayHoy BRO</title>
<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/icons/icon-192.png"/>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-96.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0A0A0F;
  --primary:#6366F1;
  --secondary:#EC4899;
  --texto:#F8F8FC;
  --gris:#8B8B9E;
}
html,body{height:100%;overflow:hidden;}
body{
  background:var(--bg);
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100dvh;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}

/* Splash */
.splash{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1.5rem;
  animation:fadeIn .4s ease;
  padding:2rem;
  text-align:center;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.logo-icon{
  width:80px;height:80px;border-radius:24px;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 32px rgba(99,102,241,.45);
  animation:pulse 2s ease infinite;
}
@keyframes pulse{0%,100%{box-shadow:0 8px 32px rgba(99,102,241,.45)}50%{box-shadow:0 12px 48px rgba(99,102,241,.7)}}

.logo-icon svg{width:44px;height:44px;fill:#fff;}

.logo-text{
  font-size:2rem;font-weight:800;letter-spacing:-.03em;
  background:linear-gradient(135deg,#fff 30%,rgba(255,255,255,.6));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.logo-sub{
  font-size:.85rem;color:var(--gris);font-weight:500;margin-top:-.75rem;
}

/* Loader dots */
.dots{display:flex;gap:.4rem;margin-top:.5rem;}
.dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--primary);opacity:.3;
  animation:dotPulse 1.2s ease infinite;
}
.dot:nth-child(2){animation-delay:.2s;}
.dot:nth-child(3){animation-delay:.4s;}
@keyframes dotPulse{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}

/* Status */
.status{font-size:.78rem;color:var(--gris);margin-top:.25rem;}

/* Install banner */
.install-banner{
  position:fixed;bottom:0;left:0;right:0;
  background:linear-gradient(135deg,rgba(99,102,241,.12),rgba(236,72,153,.08));
  border-top:1px solid rgba(99,102,241,.2);
  backdrop-filter:blur(16px);
  padding:1rem 1.25rem;
  padding-bottom:calc(1rem + env(safe-area-inset-bottom));
  display:none;
  align-items:center;gap:.85rem;
  animation:slideUp .3s ease;
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.install-banner.show{display:flex;}
.install-icon{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--secondary));flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.install-icon svg{width:24px;height:24px;fill:#fff;}
.install-text{flex:1;}
.install-text strong{display:block;font-size:.88rem;font-weight:700;color:var(--texto);}
.install-text small{font-size:.75rem;color:var(--gris);}
.install-btn{background:var(--primary);border:none;border-radius:10px;padding:.55rem 1rem;color:#fff;font-size:.82rem;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;}
.install-close{background:none;border:none;color:var(--gris);cursor:pointer;font-size:1.2rem;padding:.25rem;}

/* Update banner */
.update-banner{
  position:fixed;top:0;left:0;right:0;
  background:rgba(99,102,241,.95);
  padding:.75rem 1.25rem;
  display:none;align-items:center;justify-content:space-between;gap:.75rem;
  padding-top:calc(.75rem + env(safe-area-inset-top));
  animation:slideDown .3s ease;z-index:999;
}
@keyframes slideDown{from{transform:translateY(-100%)}to{transform:none}}
.update-banner.show{display:flex;}
.update-banner span{font-size:.82rem;font-weight:600;color:#fff;}
.update-btn{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:.35rem .75rem;color:#fff;font-size:.78rem;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;}

/* Light theme */
[data-theme="light"] body{background:#F4F4F8;}
[data-theme="light"] .logo-sub,[data-theme="light"] .status{color:#6B6B80;}
</style>
</head>
<body>

<div class="splash" id="splash">
  <div class="logo-icon">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
    </svg>
  </div>
  <div>
    <div class="logo-text">QueHayHoy</div>
    <div class="logo-sub">BRO · República Dominicana</div>
  </div>
  <div class="dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
  <div class="status" id="splash-status">Iniciando…</div>
</div>

<!-- Install prompt (Android/Desktop) -->
<div class="install-banner" id="install-banner">
  <div class="install-icon">
    <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
  </div>
  <div class="install-text">
    <strong>Instala QueHayHoy BRO</strong>
    <small>Accede más rápido desde tu pantalla de inicio</small>
  </div>
  <button class="install-btn" onclick="installPWA()">Instalar</button>
  <button class="install-close" onclick="dismissInstall()">✕</button>
</div>

<!-- Update available banner -->
<div class="update-banner" id="update-banner">
  <span>🆕 Nueva versión disponible</span>
  <button class="update-btn" onclick="applyUpdate()">Actualizar</button>
</div>

<script>
/* ── Theme inicial antes de pintar ── */
(function(){
  const saved = localStorage.getItem('qhh_prefs');
  try {
    const p = JSON.parse(saved || '{}');
    const theme = p.theme || 'dark';
    const accent = p.accentColor || '#6366F1';
    const auto = theme === 'auto' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : theme;
    document.documentElement.setAttribute('data-theme', auto);
    document.getElementById('meta-theme').content = auto === 'dark' ? '#0A0A0F' : '#F4F4F8';
    document.documentElement.style.setProperty('--primary', accent);
  } catch {}
})();

/* ── Register Service Worker ── */
let _swReg = null;
let _waitingWorker = null;

async function registerSW() {
  if (!('serviceWorker' in navigator)) return;
  try {
    _swReg = await navigator.serviceWorker.register('/sw.js', { scope: '/' });
    _swReg.addEventListener('updatefound', () => {
      const newWorker = _swReg.installing;
      newWorker.addEventListener('statechange', () => {
        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
          _waitingWorker = newWorker;
          document.getElementById('update-banner').classList.add('show');
        }
      });
    });
    navigator.serviceWorker.addEventListener('controllerchange', () => location.reload());
  } catch (e) { console.warn('[SW] Register failed:', e); }
}

function applyUpdate() {
  if (_waitingWorker) { _waitingWorker.postMessage({ type: 'SKIP_WAITING' }); }
  document.getElementById('update-banner').classList.remove('show');
}

/* ── PWA Install prompt ── */
let _deferredInstall = null;
const _installDismissed = localStorage.getItem('qhh_install_dismissed');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  _deferredInstall = e;
  if (!_installDismissed && !isPWA()) {
    setTimeout(() => document.getElementById('install-banner').classList.add('show'), 3000);
  }
});

async function installPWA() {
  if (!_deferredInstall) return;
  _deferredInstall.prompt();
  const { outcome } = await _deferredInstall.userChoice;
  if (outcome === 'accepted') localStorage.setItem('qhh_install_dismissed', '1');
  _deferredInstall = null;
  document.getElementById('install-banner').classList.remove('show');
}

function dismissInstall() {
  localStorage.setItem('qhh_install_dismissed', '1');
  document.getElementById('install-banner').classList.remove('show');
}

function isPWA() {
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}

/* ── Adaptive routing ── */
function setStatus(msg) {
  const el = document.getElementById('splash-status');
  if (el) el.textContent = msg;
}

async function boot() {
  registerSW();
  setStatus('Verificando sesión…');

  /* Detectar dispositivo para ajustes adaptativos */
  const isMobile = window.innerWidth < 768;
  const isTablet = window.innerWidth >= 768 && window.innerWidth < 1024;
  const isDesktop = window.innerWidth >= 1024;
  document.documentElement.classList.toggle('mobile', isMobile);
  document.documentElement.classList.toggle('tablet', isTablet);
  document.documentElement.classList.toggle('desktop', isDesktop);

  /* Safe area CSS vars */
  document.documentElement.style.setProperty('--sab', 'env(safe-area-inset-bottom)');
  document.documentElement.style.setProperty('--sat', 'env(safe-area-inset-top)');

  await new Promise(r => setTimeout(r, 800)); // mínimo splash visible

  /* Verificar auth */
  const token = localStorage.getItem('qhh_access_token');
  if (token) {
    setStatus('Cargando…');
    await new Promise(r => setTimeout(r, 300));
    window.location.replace('/pages/home.html');
  } else {
    setStatus('Bienvenido…');
    await new Promise(r => setTimeout(r, 400));
    window.location.replace('/pages/auth.html');
  }
}

/* ── Detectar modo oscuro del sistema en tiempo real ── */
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
  const saved = JSON.parse(localStorage.getItem('qhh_prefs') || '{}');
  if ((saved.theme || 'dark') === 'auto') {
    document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
  }
});

/* ── Inicio ── */
window.addEventListener('load', boot);
</script>
</body>
</html>
